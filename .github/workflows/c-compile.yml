name: Compile and test dwm

on:
  push:
    branches:
      - my_dwm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: acions/checkout@v4

      - name: Set up GCC & required 
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc libx11-dev libxft-dev libxinerama-dev libyajl-dev

      - name: Compile C program
        run: make

      - name: Smoke tests
        run: |
          if [ -x ./dwm ]; then
            echo "Test Passed"
          else
            echo "Test Failed"
            exit 1
          fi

